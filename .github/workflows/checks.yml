name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Tests without game resources
        run: node --test tests/cache-policy.test.mjs tests/conversion-cache.test.mjs tests/equipment-layout.test.mjs tests/live-saber.test.mjs tests/material-export.test.mjs tests/review.test.mjs tests/setup.test.mjs
