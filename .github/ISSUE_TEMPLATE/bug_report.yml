name: Bug report
description: Report a reproducible problem with the viewer or export.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "Please do not attach game files, extracted textures/models, account information, or logs containing private paths."
  - type: input
    id: version
    attributes:
      label: Viewer version
      placeholder: "0.2.1 Windows portable"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and game version
      description: Include the extracted-data version if known.
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include model/NPC/item names, species/body type and animation where relevant.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Include the error text or a screenshot if useful. Remove personal information.
