name: Feature request
description: Suggest an improvement to the modding workflow.
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the modding workflow or limitation.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested behavior
      description: Explain what would make the workflow easier.
    validations:
      required: true
